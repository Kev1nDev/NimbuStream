  <text x="730" y="84" text-anchor="middle" font-size="11" fill="#666">GPU L4 · NVENC · EIP</text>
  <text x="730" y="104" text-anchor="middle" font-size="11" fill="#666">Sunshine + VDD</text>

  <rect x="10" y="170" width="800" height="140" rx="10" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
  <text x="410" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">AWS — BascoVpc (10.0.0.0/16)</text>
  <text x="410" y="215" text-anchor="middle" font-size="11" fill="#777">Subred publica 10.0.1.0/24 · Internet Gateway · NACL + SG + KMS + Flow Logs</text>

  <rect x="60" y="235" width="700" height="60" rx="8" fill="#fff" stroke="#bbb"/>
