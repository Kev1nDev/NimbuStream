  <text x="410" y="283" text-anchor="middle" font-size="12" fill="#555">65 GB root (gaming) · 300 GB juegos (solo-descarga) · 8 GB VPN</text>

  <rect x="10" y="340" width="240" height="150" rx="10" fill="#fee" stroke="#d93025" stroke-width="2"/>
  <text x="130" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#a50e0e">Seguridad</text>
  <text x="130" y="392" text-anchor="middle" font-size="11" fill="#555">• 1 solo puerto publico: 51820</text>
  <text x="130" y="412" text-anchor="middle" font-size="11" fill="#555">• Sin SSH (SSM Session Manager)</text>
  <text x="130" y="432" text-anchor="middle" font-size="11" fill="#555">• IMDSv2 obligatorio</text>
  <text x="130" y="452" text-anchor="middle" font-size="11" fill="#555">• VPC Flow Logs → CloudWatch</text>
  <text x="130" y="472" text-anchor="middle" font-size="11" fill="#555">• NACL deny-by-default</text>

  <rect x="280" y="340" width="240" height="150" rx="10" fill="#eef" stroke="#5e35b1" stroke-width="2"/>
  <text x="400" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#3e1b8f">Streaming stack</text>
  <text x="400" y="392" text-anchor="middle" font-size="11" fill="#555">• NVIDIA NVENC (nvenc)</text>
  <text x="400" y="412" text-anchor="middle" font-size="11" fill="#555">• Virtual Display 1280x720@60</text>
  <text x="400" y="432" text-anchor="middle" font-size="11" fill="#555">• Sunshine (servidor)</text>
  <text x="400" y="452" text-anchor="middle" font-size="11" fill="#555">• Moonlight (cliente)</text>
  <text x="400" y="472" text-anchor="middle" font-size="11" fill="#555">• ViGEmBus (gamepad)</text>

  <rect x="550" y="340" width="260" height="150" rx="10" fill="#efe" stroke="#00897b" stroke-width="2"/>
  <text x="680" y="368" text-anchor="middle" font-size="14" font-weight="bold" fill="#00564d">Costos</text>
  <text x="680" y="392" text-anchor="middle" font-size="11" fill="#555">• g6.xlarge ~USD 0.80/h (encendido)</text>
  <text x="680" y="412" text-anchor="middle" font-size="11" fill="#555">• EBS ~USD 29/mes (apagado, sigue)</text>
  <text x="680" y="432" text-anchor="middle" font-size="11" fill="#555">• Sin NAT gateway (~USD 32/mes)</text>
  <text x="680" y="452" text-anchor="middle" font-size="11" fill="#555">• Stop/start = ida a ~0</text>
  <text x="680" y="472" text-anchor="middle" font-size="11" fill="#555">• Volumen juegos solo-descarga</text>
