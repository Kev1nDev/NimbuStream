<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="240" height="120" rx="10" fill="#fff7e6" stroke="#e6a700" stroke-width="2"/>
  <text x="130" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5b00">TU PC (cliente)</text>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#555">Moonlight + WireGuard client</text>
  <text x="130" y="86" text-anchor="middle" font-size="11" fill="#777">IP dinamica / LAN</text>
  <text x="130" y="106" text-anchor="middle" font-size="11" fill="#777">gamepad: ViGEmBus virtual</text>

  <line x1="250" y1="70" x2="350" y2="70" stroke="#1a73e8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="55" text-anchor="middle" font-size="11" fill="#1a73e8">WireGuard</text>
  <text x="300" y="95" text-anchor="middle" font-size="11" fill="#1a73e8">UDP 51820 (cifrado)</text>

  <rect x="360" y="10" width="200" height="120" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="460" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#174ea6">t3.micro VPN</text>
  <text x="460" y="66" text-anchor="middle" font-size="12" fill="#333">WireGuard hub + NAT</text>
  <text x="460" y="88" text-anchor="middle" font-size="11" fill="#666">EIP fija · SSM (sin SSH)</text>
  <text x="460" y="106" text-anchor="middle" font-size="11" fill="#666">10.66.66.1</text>

  <line x1="560" y1="70" x2="640" y2="70" stroke="#188038" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="55" text-anchor="middle" font-size="11" fill="#188038">RDP / Moonlight</text>
  <text x="600" y="95" text-anchor="middle" font-size="11" fill="#188038">solo via SG del VPN</text>

  <rect x="650" y="10" width="160" height="120" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="730" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d652d">g6.xlarge</text>
